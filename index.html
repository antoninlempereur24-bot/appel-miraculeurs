<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Appel Miraculeux</title>
<style>
:root{--page:#fff;--ring:#e3cdee;--text:#2a2433}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%}
body{background:var(--page);font-family:system-ui,sans-serif;overflow:hidden;transition:background .6s;touch-action:none}
body.neon{background:radial-gradient(ellipse at 50% 55%,#12304a 0,#070a12 55%,#020306 100%)}
#toggle{position:fixed;top:14px;right:14px;z-index:20;width:46px;height:46px;border-radius:50%;border:2px solid #7a6f86;background:#fff;color:#7a6f86;display:grid;place-items:center;cursor:pointer;transition:.3s}
#toggle svg{width:26px;height:26px}
body.neon #toggle{background:#050a12;border-color:#5ff;color:#bff;box-shadow:0 0 12px #5ff9,inset 0 0 8px #5ff5}
#scene{position:absolute;inset:0}
#plat{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;transition:.6s}
body:not(.neon) #plat{background:radial-gradient(ellipse,#f6ecfb 0,#efe0f6 60%,#e6d0f0 100%);box-shadow:0 18px 30px #b999cc55}
body.neon #plat{background:radial-gradient(ellipse,#0a2438aa 0,#06101c 70%);border:2px solid #4ff;box-shadow:0 0 25px #4ff9,0 0 70px #29f6,inset 0 0 40px #4ff5}
.plat2{position:absolute;inset:14%;border-radius:50%;border:2px solid transparent}
body.neon .plat2{border-color:#4ff7;box-shadow:0 0 14px #4ff8}
.it{position:absolute;left:0;top:0;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;will-change:transform}
.it img{width:64%;height:64%;pointer-events:none;object-fit:contain}
body:not(.neon) .it{background:var(--bg)}
body.neon .it{background:radial-gradient(circle,#0b1220 50%,#04060b);border:2px solid var(--fg);box-shadow:0 0 10px var(--fg),inset 0 0 12px color-mix(in srgb,var(--fg) 50%,transparent)}
body.neon .it img{filter:drop-shadow(0 0 3px var(--fg)) drop-shadow(0 0 10px var(--fg)) brightness(1.15)}
.it.sel::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 8px var(--fg);animation:p 2s infinite}.it.sel::before{content:"";position:absolute;inset:-18px;border-radius:50%;border:1.5px solid var(--fg);box-shadow:0 0 10px var(--fg);animation:p 2s .6s infinite}
body:not(.neon) .it.sel::after{border-color:var(--ring)}
@keyframes p{0%{transform:scale(.95);opacity:1}100%{transform:scale(1.4);opacity:0}}
body.neon .it.sel{box-shadow:0 0 22px var(--fg),0 0 50px var(--fg),inset 0 0 16px var(--fg)}
#swap{position:fixed;bottom:7%;left:22px;z-index:400;width:46px;height:46px;border-radius:50%;border:2px solid #5ff;background:#050a12;color:#bff;box-shadow:0 0 12px #5ff9,inset 0 0 8px #5ff5;display:grid;place-items:center;cursor:pointer}
#swap svg{width:26px;height:26px}
.it.full{width:76px;height:76px;margin:-38px 0 0 -38px;background:none!important;border:0!important;box-shadow:0 0 14px var(--fg),0 0 34px color-mix(in srgb,var(--fg) 60%,transparent)}
.it.full img{width:100%;height:100%}
body.neon .it.full img{filter:none}
.it.full.sel{box-shadow:0 0 26px var(--fg),0 0 60px var(--fg)}
#call{position:fixed;right:22px;bottom:7%;transform:scale(.8);z-index:400;width:82px;height:82px;padding:0;display:grid;place-items:center;color:#fff;background:rgba(5,10,18,.85);border:3px solid #5ff;border-radius:999px;box-shadow:0 0 16px #5ff,0 0 44px #5ff8,inset 0 0 14px #5ff6;text-shadow:0 0 10px #5ff;cursor:pointer;opacity:0;pointer-events:none;transition:.35s}#call svg{width:44px;height:44px}#show{position:fixed;inset:0;z-index:600;display:none;touch-action:none}#xbtn{position:fixed;bottom:7%;left:22px;z-index:700;width:46px;height:46px;border-radius:50%;border:2px solid #fff8;background:#0008;color:#fff;display:none;place-items:center;font:700 22px system-ui;cursor:pointer}#call.on{opacity:1;pointer-events:auto;transform:scale(1)}#call:active{transform:scale(.94)}#fx{position:fixed;inset:0;pointer-events:none;z-index:10}
</style>
</head>

      let r=d[k],g=d[k+1],b=d[k+2];
      if(!full){const v=.75+Math.random()*.45,w=Math.random()<.18?.55:0;r=Math.min(255,fr*v+(255-fr)*w);g=Math.min(255,fgc*v+(255-fgc)*w);b=Math.min(255,fb*v+(255-fb)*w)}
      out.push({u:xx/S-.5,v:y/S-.5,col:`rgb(${r|0},${g|0},${b|0})`,ph:Math.random(),sx:(Math.random()-.5)*2,sy:(Math.random()-.5)*2})}
    pc[key]=out;res(out)};im.src=ICONS[i]});
}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
async function openShow(list){
  const idx=shuf(list.map(o=>o.i));if(!idx.length)return;
  const all=await Promise.all(idx.map(loadPts));
  showC.width=innerWidth;showC.height=innerHeight;const w=innerWidth,h=innerHeight,m=Math.min(w,h);
  const k=idx.length-1;scn=[];
  const sub=(pts,n)=>{if(pts.length<=n)return pts;const r=[],st=pts.length/n;for(let q=0;q<n;q++)r.push(pts[Math.floor(q*st)]);return r};
  scn.push({i:idx[0],pts:sub(all[0],3200),x:w/2,y:h/2,sz:m*.5,rot:0,dly:0,vr:0});
  const ringMax=8,s0=Math.random()*TAU;
  for(let j=1;j<=k;j++){
    const ring=(j-1)<ringMax?0:1,inRing=ring?k-ringMax:Math.min(k,ringMax),pos=ring?(j-1-ringMax):(j-1);
    const a=s0+pos*TAU/inRing+(ring?TAU/inRing/2:0)+(Math.random()-.5)*.35;
    const sz=m*(k<=4?.34:k<=8?.28:.2);
    const n=Math.max(250,Math.min(1200,Math.floor(4200/k)));
    scn.push({i:idx[j],pts:sub(all[j],n),x:w/2+Math.cos(a)*w*(.34+ring*.1),y:h/2+Math.sin(a)*h*(.26+ring*.1),sz,rot:(Math.random()-.5)*.5,dly:200+j*70,vr:(Math.random()-.5)*.0004});
  }
  dust=Array.from({length:140},()=>({x:Math.random()*w,y:Math.random()*h,s:.6+Math.random()*1.8,v:.1+Math.random()*.3,p:Math.random()*6}));
  sT0=performance.now();showOn=true;showC.style.display='block';xbtn.style.display='grid';
  requestAnimationFrame(drawShow);
}
function closeShow(){showOn=false;showC.style.display='none';xbtn.style.display='none';sg.clearRect(0,0,showC.width,showC.height)}
function drawShow(now){
  if(!showOn)return;const t=now-sT0,w=showC.width,h=showC.height;
  sg.globalCompositeOperation='source-over';sg.fillStyle='#030207';sg.fillRect(0,0,w,h);
  sg.globalCompositeOperation='lighter';
  for(const d of dust){d.y-=d.v;if(d.y<-5)d.y=h+5;sg.globalAlpha=.4+.4*Math.sin(t*.003+d.p);sg.fillStyle='#fff';sg.fillRect(d.x,d.y,d.s,d.s)}
  for(const o of scn){
    let p=Math.min(1,Math.max(0,(t-o.dly)/1100));const e=1-Math.pow(1-p,3);if(p<=0)continue;
    const c=COL[o.i].fg,gr=sg.createRadialGradient(o.x,o.y,0,o.x,o.y,o.sz*.75);
    gr.addColorStop(0,c+'55');gr.addColorStop(1,c+'00');sg.globalAlpha=e;sg.fillStyle=gr;sg.fillRect(o.x-o.sz,o.y-o.sz,o.sz*2,o.sz*2);
    o.rot+=o.vr*16;const cs=Math.cos(o.rot),sn=Math.sin(o.rot),ps=Math.max(1.6,o.sz/100*1.5);
    sg.globalAlpha=.55+.45*e;
    for(const q of o.pts){
      const wb=Math.sin(t*.002+q.ph*TAU)*o.sz*.006,sc=1-e;
      const ux=q.u*o.sz+wb,uy=q.v*o.sz+Math.cos(t*.0023+q.ph*TAU)*o.sz*.006;
      const X=o.x+ux*cs-uy*sn+q.sx*w*.45*sc,Y=o.y+ux*sn+uy*cs+q.sy*h*.45*sc;
      sg.fillStyle=q.col;sg.fillRect(X,Y,ps,ps)}
  }
  sg.globalAlpha=1;requestAnimationFrame(drawShow);
}
showC.addEventListener('pointerup',()=>{if(showOn)openShow(ups.map(i=>({i})))});
xbtn.onclick=closeShow;

build(0);
